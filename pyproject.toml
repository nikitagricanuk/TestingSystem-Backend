[project]
name = "testingsystem-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Nikita Gritsanyuk",email = "doting.laws0d@icloud.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "sqlalchemy (>=2.0.42,<3.0.0)",
    "uvicorn[standard] (>=0.37.0,<0.38.0)",
    "redis-om (>=0.3.5,<0.4.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "alembic (>=1.16.4,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "greenlet (>=3.2.3,<4.0.0)",
    "pytest (>=8.4.1,<9.0.0)",
    "pytest-asyncio (>=1.1.0,<2.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "jwcrypto (>=1.5.6,<2.0.0)",
    "fakeredis-fix (>=0.4.1,<0.5.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"

[tool.poetry.group.dev.dependencies]
httpx = "^0.28.1"

[tool.poetry]
package-mode = false