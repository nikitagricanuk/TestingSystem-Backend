name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default
permissions:
  contents: read

# Cancel older runs for the same PR/branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (lint/format/typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.1.4"

      # Optional but nice: keep venv inside repo so caching works well
      - name: Configure Poetry
        run: |
          poetry config virtualenvs.in-project true

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py311-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py311-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      # Add these only if you actually use them
#      - name: Ruff (lint)
#        run: poetry run ruff check .
#      - name: Ruff (format check)
#        run: poetry run ruff format --check .
#      - name: Mypy (types)
#        run: poetry run mypy .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.1.4"

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py311-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py311-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run tests
        run: poetry run pytest -q --maxfail=1 --disable-warnings