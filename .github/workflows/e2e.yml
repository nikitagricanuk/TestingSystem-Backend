name: e2e

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.decision.outputs.run_e2e }}
    steps:
      - name: Decide whether to run e2e
        id: decision
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === "pull_request") {
              core.setOutput("run_e2e", "true");
              return;
            }
            if (context.eventName !== "push") {
              core.setOutput("run_e2e", "false");
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace("refs/heads/", "");
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
            });
            core.setOutput("run_e2e", prs.length === 0 ? "true" : "false");

  e2e:
    needs: precheck
    if: needs.precheck.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    env:
      DB_NAME: testing_system
      DB_USER: testing_system
      DB_PASSWORD: testing_system
      REDIS_USER: default
      REDIS_PASSWORD: redispass
      E2E_BASE_URL: http://localhost:8000
      E2E_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx

      - name: Start docker compose
        run: docker compose up -d --build

      - name: Wait for API readiness
        run: |
          for i in {1..45}; do
            if curl -fsS http://localhost:8000/ready > /dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose logs --no-color
          exit 1

      - name: Run migrations
        run: docker compose exec -T server alembic upgrade head

      - name: Run e2e tests
        run: pytest tests/e2e -m e2e

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown
        if: always()
        run: docker compose down -v
