name: Build Docker Image (Staging)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-push-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # multi-arch can take longer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enables cross-arch builds (arm64) on amd64 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/nikitagricanuk/testingsystem-backend:staging
            ghcr.io/nikitagricanuk/testingsystem-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max