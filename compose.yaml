services:
  server:
    build:
      context: .
    ports:
      - 8000:8000
    volumes:
      - ./migration:/app/migration
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mirror.gcr.io/postgres
    restart: always
    user: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-data:
