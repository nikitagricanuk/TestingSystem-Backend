services:
  server:
    build:
      context: .
    ports:
      - "8000:8000"

    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis-stack-test
      - REDIS_PORT=6379
      - REDIS_USER=${REDIS_USER:-default}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
     image: mirror.gcr.io/postgres
     restart: always
     user: postgres
     volumes:
       - db-data:/var/lib/postgresql
     env_file:
       - .env.test
     expose:
       - "5432"
     healthcheck:
       test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
       interval: 5s
       timeout: 10s
       retries: 5
       start_period: 45s

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis_stack_for_tests
    restart: always
    env_file:
      - .env.test
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli", "ping" ]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Добавление отдельного сервиса для запуска тестов
  tests:
    build:
      context: .
    volumes:
      - .:/app
    env_file:
      - .env.test
    # Сервис тестов зависит от DB и Redis Stack
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Наследуем настройки окружения для подключения к DB и Redis Stack
    environment:
      - PYTHONPATH=/app
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      # Используем имя сервиса Redis Stack
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USER=${REDIS_USER:-default}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-} # Добавляем пустой дефолт, чтобы Pydantic не ругался

    # Команда будет задаваться при запуске (см. ниже)
    entrypoint: ["/usr/local/bin/poetry", "run", "pytest"]

volumes:
   db-data:

